:root{--ds:#150B4F;--or:#FF8500;--ch:#333333;--pa:#FBF8F5;--o10:#FFF3E6;--ln:#E2E0EA;--gr:#1B6B2F;--rd:#B3231C;--pl:#D7E0FF}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:#F4F3F7;color:var(--ch);font-family:'Manrope',system-ui,sans-serif;font-size:1.5rem;line-height:1.6}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a.skip{position:absolute;left:-999px;background:var(--or);color:var(--ds);padding:.8rem 1.2rem;z-index:9;font-weight:700}
a.skip:focus{left:1rem;top:1rem}
header.top{background:var(--ds);padding:1.6rem 1.5rem 1.2rem}
.topin{max-width:56rem;margin:0 auto}
.top img{width:11rem;display:block;margin-bottom:1rem}
.top h1{color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:2.2rem;margin:0;line-height:1.15}
.top .sub{color:var(--or);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1.3rem;margin:.3rem 0 0}
.pw{max-width:56rem;margin:1.1rem auto 0;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.track{flex:1;min-width:14rem;height:1rem;background:#2B2270;border:2px solid #D7E0FF;border-radius:99px;overflow:hidden}
#bar{height:100%;width:0;background:var(--or);border-radius:99px;transition:width .3s}
.pw span{color:var(--pl);font-size:1.2rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:2rem 1.5rem 6rem}
.daymark{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;color:var(--ds);font-size:1.35rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 .8rem;padding-bottom:.5rem;border-bottom:2px solid var(--ln)}
.msg{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:1.4rem 1.6rem;margin-bottom:1.4rem}
.msgh{display:flex;gap:1rem;align-items:flex-start;margin-bottom:1rem}
.av{flex:none;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--or);color:var(--ds);display:grid;place-items:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1.4rem}
.who{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.55rem;color:var(--ds);margin:0}
.role{font-family:'Manrope',sans-serif;font-weight:400;font-size:1.25rem;color:#6B6880}
.meta{margin:.15rem 0 0;font-size:1.2rem;color:#6B6880}
.file{font-family:ui-monospace,Menlo,monospace;color:var(--ds)}
.body{margin:0;padding:1rem 1.2rem;background:var(--pa);border-left:.35rem solid var(--pl);font-size:1.45rem}
.q{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:1.5rem 1.6rem}
fieldset{border:0;margin:0;padding:0}
.stem{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;color:var(--ds);font-size:1.6rem;line-height:1.35;padding:0;margin-bottom:1rem}
.hint{font-size:1.25rem;color:#6B6880;margin:-.4rem 0 1rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;padding:.75rem .9rem;border:1px solid var(--ln);border-radius:8px;margin-bottom:.6rem;flex-wrap:wrap}
.opt input{margin-top:.42rem;width:1.3rem;height:1.3rem;flex:none;accent-color:var(--ds)}
.opt label{font-size:1.4rem;cursor:pointer;flex:1;min-width:12rem}
.opt:has(input:focus-visible){outline:3px solid var(--ds);outline-offset:2px}
.opt.isans{border-color:var(--gr);background:#F1F7F2}
.opt.iswrong{border-color:var(--rd);background:#FCF2F1}
.rtag{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1.15rem;white-space:nowrap}
.isans .rtag,.rowok .rtag{color:var(--gr)}
.iswrong .rtag,.rowno .rtag{color:var(--rd)}
.mrow{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;padding:.7rem .9rem;border:1px solid var(--ln);border-radius:8px;margin-bottom:.6rem}
.mlab{flex:1;min-width:14rem;font-size:1.35rem}
.mrow select{font-family:inherit;font-size:1.3rem;padding:.5rem .6rem;border:1px solid var(--ds);border-radius:6px;background:#fff;color:var(--ds)}
.rowok{border-color:var(--gr);background:#F1F7F2}
.rowno{border-color:var(--rd);background:#FCF2F1}
.btn{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1.4rem;background:var(--or);color:var(--ds);border:0;border-radius:99px;padding:.8rem 1.8rem;cursor:pointer;margin-top:.6rem}
.btn:hover{background:#e57800}
.btn:focus-visible{outline:3px solid var(--ds);outline-offset:3px}
.btn:disabled{background:var(--ln);color:#4F4C63;cursor:default}
.fb{margin-top:1.2rem;border-radius:10px;padding:0;max-height:0;overflow:hidden}
.fb.show{padding:1.2rem 1.4rem;max-height:none}
.fb:focus{outline:3px solid var(--ds);outline-offset:2px}
.fb.good{background:#F1F7F2;border-left:.5rem solid var(--gr)}
.fb.bad{background:#FCF2F1;border-left:.5rem solid var(--rd)}
.verdict{margin:0 0 .5rem;font-family:'Plus Jakarta Sans',sans-serif;font-size:1.45rem;color:var(--ds)}
.mark{font-size:1.7rem;margin-right:.4rem}
.fb.good .mark{color:var(--gr)} .fb.bad .mark{color:var(--rd)}
.fb p{margin:0 0 .6rem;font-size:1.38rem}
.end{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:1.8rem 1.8rem 2.2rem}
.endh{font-family:'Plus Jakarta Sans',sans-serif;color:var(--ds);font-size:2.4rem;margin:0 0 .6rem}
.endh:focus{outline:3px solid var(--ds);outline-offset:3px}
.big{font-size:1.6rem}
.bh{font-family:'Plus Jakarta Sans',sans-serif;color:var(--ds);font-size:1.7rem;margin:1.8rem 0 .5rem}
.bl{padding-left:1.4rem} .bl li{margin-bottom:.5rem;font-size:1.35rem}
.bo{display:block;font-size:1.15rem;color:#6B6880}
.clean{background:var(--o10);padding:1rem 1.2rem;border-radius:8px;font-size:1.38rem}
table.res{width:100%;border-collapse:collapse;font-size:1.25rem;margin-top:.6rem}
table.res th{background:var(--ds);color:#fff;text-align:left;padding:.6rem .8rem}
table.res td{padding:.55rem .8rem;border-bottom:1px solid var(--ln)}
table.res tr:nth-child(even) td{background:var(--pa)}
.tok{color:var(--gr);font-weight:700}.tno{color:var(--rd);font-weight:700}
@media (max-width:34rem){body{font-size:1.4rem}.top h1{font-size:1.9rem}}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){#confetti{display:none}}

.intro{background:#fff;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.hero{background:var(--ds);padding:1.6rem 1.6rem 0}
.scene{display:block;width:100%;height:auto;max-height:26rem;margin:0 auto}
.introbody{padding:1.8rem 1.8rem 2rem}
.introh{font-family:'Plus Jakarta Sans',sans-serif;color:var(--ds);font-size:2.3rem;line-height:1.2;margin:0 0 1rem}
.introh:focus{outline:3px solid var(--ds);outline-offset:3px}
.intro p{font-size:1.5rem;margin:0 0 1.1rem}
.cast{background:var(--pa);border-left:.4rem solid var(--or);padding:1.1rem 1.3rem;border-radius:0 8px 8px 0;margin:0 0 1.3rem}

.rules li{display:flex;gap:.9rem;align-items:flex-start;font-size:1.42rem}
.rules .n{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--or);color:var(--ds);
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1.3rem;display:grid;place-items:center;margin-top:.1rem}
.rules b{color:var(--ds)}
.startrow{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.startnote{font-size:1.25rem;color:#5A5770}
@media (max-width:44rem){.hero{padding:1.1rem 1.1rem 0}.introbody{padding:1.4rem 1.3rem 1.6rem}.introh{font-size:2rem}}

.mnum{margin:.35rem 0 0;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1.15rem;
  letter-spacing:.04em;text-transform:uppercase;color:#5A5770}
.qn{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1.15rem;
  letter-spacing:.04em;text-transform:uppercase;color:#8a4b00;margin-bottom:.5rem}

const WEEK = [
 {day:"Monday", time:"8:47 AM", from:"Dana", role:"Communications", avatar:"D",
  msg:"Morning! Here's the resident newsletter for Thursday. I made all the section titles nice and big and bold so they really stand out. There's a three-page table of program dates in there too.",
  file:"summer-newsletter.docx",
  qs:[
   {obj:"M2.2", id:"DA103-FA-01", stem:"Dana's section titles are 16-point bold dark blue, formatted with the Normal style. The newsletter looks well organized. Why can't a screen reader user navigate it?",
    opts:["Dark blue on white doesn't meet the contrast minimum","No heading styles were applied, so there's no heading structure to navigate","16 point is too small to register as a heading","Screen readers ignore bold text"],a:1,
    ok:"Dana replies: \"Wait, so the outline thing on the left has been empty this whole time?\" It has. For three years.",
    no:"Assistive technology reads the file's underlying structure, not how text looks. Ask a screen reader for the heading list in Dana's newsletter and it comes back empty."},
   {obj:"M3.1", id:"DA103-FA-02", stem:"That three-page table of program dates needs a real header row. Which two settings does it take in Word?",
    multi:true,opts:["Table Design &gt; Header Row","Bold the first row and shade it","Table Properties &gt; Row &gt; Repeat as header row at the top of each page","Add a blank row above the header for spacing"],a:[0,2],
    ok:"Both, not one of them. The first declares the relationship, the second makes it repeat when the table breaks across pages.",
    no:"It takes both settings. Bolding and shading change appearance only, and a blank spacer row splits one table into two as far as Word is concerned."}]},

 {day:"Monday", time:"2:15 PM", from:"Marcus", role:"Parks", avatar:"M",
  msg:"Can you get this up on the site today? It's the trail closure notice. I took a photo of the posted flyer since I couldn't find the original file.",
  file:"trail-closures.pdf",
  qs:[
   {obj:"M1.4", id:"DA103-FA-03", stem:"You open it and drag your cursor across the body text. Nothing highlights. What is this file, and what will a screen reader announce?",
    opts:["A tagged PDF with a reading order problem, read out of order","A password-protected PDF, announced as a security warning","An image-only scan with no text layer, and the screen reader announces nothing","An untagged but text-based PDF, read without any structure"],a:2,
    ok:"Nothing selects because there's no text in the file. It's a picture of a piece of paper.",
    no:"If text won't select, there is no text, only an image of text. In an untagged PDF the text does select, it just carries no structure. That distinction is the whole diagnosis."},
   {obj:"M5.2", id:"DA103-FA-04", stem:"Marcus suggests running OCR on it. \"That makes it accessible, right?\"",
    tf:true,opts:["True","False"],a:1,
    ok:"OCR adds a searchable text layer and stops there. No tags, no headings, no reading order, no table relationships, no alt text. And the recognized text still needs proofreading.",
    no:"OCR is step one of about six. It makes text selectable and searchable, which is real progress, but it adds none of the structure. Poor scans and unusual fonts also produce misreads that need proofing."}]},

 {day:"Tuesday", time:"9:02 AM", from:"Priya", role:"HR", avatar:"P",
  msg:"Open enrollment guide, needs to go out today. Heads up, I put the deadline and the premium table in as an image so the formatting wouldn't break on people's phones.",
  file:"open-enrollment-2027.docx",
  qs:[
   {obj:"M2.4", id:"DA103-FA-05", stem:"The enrollment deadline and every premium figure are inside a JPEG. What's the fix?",
    opts:["Write thorough alt text repeating the deadline and all the premium figures","Remove the image and set the deadline and the table as real text","Mark the image decorative so screen readers skip it","Add a caption below the image with the same information"],a:1,
    ok:"Text inside an image is the one alt text can't rescue. It won't scale at high zoom, won't reflow, can't be searched, copied, or translated.",

function render(){
  if(idx>=WEEK.length){return finish();}
  const it=WEEK[idx], q=it.qs[sub];
  const dayChanged = sub===0;
  let h=`<article class="msg" aria-labelledby="mh${idx}">`;
  if(dayChanged){h=`<p class="daymark">${it.day}</p>`+h;}
  h+=`<header class="msgh"><span class="av" aria-hidden="true">${it.avatar}</span>
      <div><h2 id="mh${idx}" class="who">${it.from} <span class="role">${it.role}</span></h2>
      <p class="meta">${it.day} ${it.time} · <span class="file">${it.file}</span></p>
      <p class="mnum">Message ${idx+1} of ${WEEK.length}${sub>0?' · follow-up':''}</p></div></header>
      <blockquote class="body">${it.msg}</blockquote></article>`;

  h+=`<form id="qform" class="q"><fieldset><legend class="stem">`+
      `<span class="qn">Question ${sub+1} of ${it.qs.length} on this message. </span>${q.stem}</legend>`;
  if(q.match){
    h+=`<p class="hint">Choose the category for each finding.</p><div class="matchwrap">`;
    q.pairs.forEach((p,i)=>{
      h+=`<div class="mrow"><label class="mlab" for="m${i}">${p[0]}</label>
          <select id="m${i}" name="m${i}" required><option value="">Choose one</option>`;
      q.cats.forEach(c=>{h+=`<option value="${c}">${c}</option>`;});
      h+=`</select></div>`;
    });
    h+=`</div>`;
  }else{
    const type=q.multi?"checkbox":"radio";
    if(q.multi)h+=`<p class="hint">Select all that apply.</p>`;
    q.opts.forEach((o,i)=>{
      h+=`<div class="opt"><input type="${type}" name="o" id="o${i}" value="${i}">
          <label for="o${i}">${o}</label></div>`;
    });
  }
  h+=`</fieldset><button type="submit" class="btn">Submit</button></form>
      <div id="fb" role="status" aria-live="polite" class="fb"></div>`;
  $("#stage").innerHTML=h;
  $("#qform").addEventListener("submit",check);
  const first=$("#qform input,#qform select"); if(first)first.focus();
  progress();
}
function check(e){
  e.preventDefault();
  const it=WEEK[idx], q=it.qs[sub];
  let correct=false, chosen;
  if(q.match){
    chosen=q.pairs.map((p,i)=>$("#m"+i).value);
    if(chosen.some(v=>!v)){announce("Choose a category for every row before submitting.");return;}
    correct=chosen.every((v,i)=>v===q.pairs[i][1]);
  }else if(q.multi){
    const sel=[...document.querySelectorAll("input[name=o]:checked")].map(n=>+n.value).sort();
    if(!sel.length){announce("Select at least one option before submitting.");return;}
    chosen=sel; correct=sel.length===q.a.length && sel.every((v,i)=>v===[...q.a].sort()[i]);
  }else{
    const n=document.querySelector("input[name=o]:checked");
    if(!n){announce("Select an option before submitting.");return;}
    chosen=+n.value; correct=chosen===q.a;
  }
  if(correct)score++; else bounced.push({item:it,q});
  answered.push({id:q.id,obj:q.obj,correct});
  document.querySelectorAll("#qform input,#qform select,#qform button").forEach(n=>n.disabled=true);
  markup(q,correct);
  const fb=$("#fb");
  fb.className="fb show "+(correct?"good":"bad");
  fb.innerHTML=`<p class="verdict"><span class="mark" aria-hidden="true">${correct?"✓":"✗"}</span>
    <strong>${correct?"Handled correctly":"Not quite"}</strong></p>
    <p>${correct?q.ok:q.no}</p>
    <button type="button" class="btn next" id="next">${lastQ()?"Next message":"Continue"}</button>`;
  $("#next").addEventListener("click",advance);
  fb.focus();
  progress();
}
function markup(q,correct){
  if(q.match){
    q.pairs.forEach((p,i)=>{

      row.classList.add(right?"rowok":"rowno");
      const tag=document.createElement("span");
      tag.className="rtag"; tag.textContent=right?"✓ correct":"✗ "+p[1];
      row.appendChild(tag);
    });
  }else{
    const A=Array.isArray(q.a)?q.a:[q.a];
    q.opts.forEach((o,i)=>{
      const el=document.getElementById("o"+i); if(!el)return;
      const wrap=el.closest(".opt");
      if(A.includes(i)){wrap.classList.add("isans");
        const t=document.createElement("span");t.className="rtag";t.textContent="✓ correct answer";wrap.appendChild(t);}
      else if(el.checked){wrap.classList.add("iswrong");
        const t=document.createElement("span");t.className="rtag";t.textContent="✗ your answer";wrap.appendChild(t);}
    });
  }
}
function lastQ(){return sub===WEEK[idx].qs.length-1;}
function advance(){
  if(lastQ()){idx++;sub=0;}else{sub++;}
  render(); window.scrollTo({top:0,behavior:reduced()?"auto":"smooth"});
}
function reduced(){return window.matchMedia("(prefers-reduced-motion: reduce)").matches;}
function announce(m){const fb=$("#fb");fb.className="fb show bad";fb.textContent=m;}
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const old=document.getElementById("confetti"); if(old) old.remove();
  const cv=document.createElement("canvas");
  cv.id="confetti"; cv.setAttribute("aria-hidden","true");
  document.body.appendChild(cv);
  const ctx=cv.getContext("2d");
  const dpr=Math.min(window.devicePixelRatio||1,2);
  function size(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  size(); addEventListener("resize",size);
  const COL=["#FF8500","#46B7FE","#D7E0FF","#FFFFFF","#4112FD"];
  const P=[];
  for(let i=0;i<140;i++){
    P.push({
      x: Math.random()*innerWidth,
      y: innerHeight + Math.random()*120,
      vx: (Math.random()-0.5)*3.2,
      vy: -(9 + Math.random()*7),
      w: 6+Math.random()*7, h: 9+Math.random()*9,
      rot: Math.random()*Math.PI, vr:(Math.random()-0.5)*0.28,
      c: COL[(Math.random()*COL.length)|0],
      delay: Math.random()*420
    });
  }
  const DURATION=3000, t0=performance.now();
  (function frame(now){
    const t=now-t0;
    if(t>DURATION){ cv.remove(); removeEventListener("resize",size); return; }
    ctx.clearRect(0,0,innerWidth,innerHeight);
    const fade = t>DURATION-700 ? Math.max(0,(DURATION-t)/700) : 1;
    P.forEach(p=>{
      if(t<p.delay) return;
      p.vy+=0.30; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.globalAlpha=fade; ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    requestAnimationFrame(frame);
  })(t0);
}
function finish(){
  const pass=score>=16;
  let h=`<section class="end" aria-labelledby="endh">
    <p class="daymark">Friday, 5:40 PM</p>
    <h2 id="endh" class="endh">${pass?"You got through the week.":"Rough week."}</h2>
    <p class="big"><strong>${score} of ${total}</strong> handled correctly. ${pass?"Passing is 16. You cleared it.":"Passing is 16. Not this time."}</p>`;
  if(bounced.length){
    h+=`<h3 class="bh">What came back</h3><p>These are on your desk again Monday morning.</p><ul class="bl">`;
    bounced.forEach(b=>{h+=`<li><strong>${b.item.from}</strong>, ${b.item.file}<span class="bo">Objective ${b.q.obj}</span></li>`;});
    h+=`</ul>`;
  }else{
    h+=`<p class="clean">Nothing bounced back. Your inbox on Monday is empty, which has never happened before and will not happen again.</p>`;
  }
  h+=`<h3 class="bh">By objective</h3><table class="res"><caption class="vh">Results by learning objective</caption>
      <thead><tr><th scope="col">Item</th><th scope="col">Objective</th><th scope="col">Result</th></tr></thead><tbody>`;
  answered.forEach(a=>{h+=`<tr><td>${a.id}</td><td>${a.obj}</td><td class="${a.correct?"tok":"tno"}">${a.correct?"✓ Correct":"✗ Missed"}</td></tr>`;});
  h+=`</tbody></table><button type="button" class="btn" id="again">Run the week again</button></section>`;
  $("#stage").innerHTML=h;
  $("#again").addEventListener("click",()=>{idx=0;sub=0;score=0;answered=[];bounced=[];render();});
  $("#endh").focus();
  progress();
  if(pass) confetti();
}
intro();

</script></body></html>
